name: whitewater-verification

x-node: &node
  # A fixed tag shared by every service and every acceptance lane project
  # (lane projects are selected through COMPOSE_PROJECT_NAME): the runner
  # builds the Node image once and each lane's `up -d` reuses it instead of
  # racing parallel builds of the same Dockerfile.
  image: whitewater-verify-node:latest
  build:
    context: .
  environment: &node-environment
    WHITEWATER_SEEDS: node1:7070,node2:7070,node3:7070
    WHITEWATER_NODE_CAPACITY: 100
    WHITEWATER_ADMIN_API_KEY: ${WHITEWATER_ADMIN_API_KEY:-whitewater-local-development-admin-key}
    WHITEWATER_CONTROL_NODES: 1@node1:7070,2@node2:7070,3@node3:7070
    WHITEWATER_CONTROL_PLANE_KEY: ${WHITEWATER_CONTROL_PLANE_KEY:-whitewater-local-development-control-key}
    WHITEWATER_INTERNAL_TRANSPORT: ${WHITEWATER_INTERNAL_TRANSPORT:-insecure}
    WHITEWATER_AUTO_SPLIT_INTERVAL_MS: ${WHITEWATER_AUTO_SPLIT_INTERVAL_MS:-2000}
    WHITEWATER_AUTO_SPLIT_APPEND_RATE: ${WHITEWATER_AUTO_SPLIT_APPEND_RATE:-10000}
    WHITEWATER_AUTO_SPLIT_SUSTAINED_SAMPLES: ${WHITEWATER_AUTO_SPLIT_SUSTAINED_SAMPLES:-3}
    WHITEWATER_AUTO_SPLIT_COOLDOWN_SAMPLES: ${WHITEWATER_AUTO_SPLIT_COOLDOWN_SAMPLES:-30}
    WHITEWATER_AUTO_MERGE_APPEND_RATE: ${WHITEWATER_AUTO_MERGE_APPEND_RATE:-10}
    # 0 = strict sync-before-ack; >0 amortizes plain append/commit fsyncs
    # to the interval (the acks=all durability mode for benchmarks).
    WHITEWATER_RANGE_SYNC_INTERVAL_MS: ${WHITEWATER_RANGE_SYNC_INTERVAL_MS:-0}
    # The balancer's cold-merge fuse must outlast every acceptance script's
    # quiet window: transition tests split explicitly and then hold the Feed
    # append-quiet through multi-minute Reader drains, which a short fuse
    # would read as sustained coldness and merge underneath the client.
    WHITEWATER_AUTO_MERGE_SUSTAINED_SAMPLES: ${WHITEWATER_AUTO_MERGE_SUSTAINED_SAMPLES:-3000}
    WHITEWATER_AUTO_MERGE_COOLDOWN_SAMPLES: ${WHITEWATER_AUTO_MERGE_COOLDOWN_SAMPLES:-60}

services:
  node1:
    <<: *node
    ports:
      - "${WHITEWATER_VERIFY_PORT_1:-7371}:7070"
    environment:
      <<: *node-environment
      WHITEWATER_NODE_ID: whitewater-verification-node1
      WHITEWATER_CONTROL_NODE_ID: 1
      WHITEWATER_ADVERTISE_URL: http://node1:7070
    volumes:
      - node1-data:/var/lib/whitewater

  node2:
    <<: *node
    ports:
      - "${WHITEWATER_VERIFY_PORT_2:-7372}:7070"
    environment:
      <<: *node-environment
      WHITEWATER_NODE_ID: whitewater-verification-node2
      WHITEWATER_CONTROL_NODE_ID: 2
      WHITEWATER_ADVERTISE_URL: http://node2:7070
    volumes:
      - node2-data:/var/lib/whitewater

  node3:
    <<: *node
    ports:
      - "${WHITEWATER_VERIFY_PORT_3:-7373}:7070"
    environment:
      <<: *node-environment
      WHITEWATER_NODE_ID: whitewater-verification-node3
      WHITEWATER_CONTROL_NODE_ID: 3
      WHITEWATER_ADVERTISE_URL: http://node3:7070
    volumes:
      - node3-data:/var/lib/whitewater

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${WHITEWATER_VERIFY_SUBNET:-10.250.247.0/24}
