name: whitewater-cluster

services:
  node:
    build:
      context: .
    environment:
      WHITEWATER_SEEDS: node:7070
      WHITEWATER_HEARTBEAT_MS: 1000
      WHITEWATER_MEMBER_TIMEOUT_MS: 5000
      WHITEWATER_NODE_CAPACITY: 100
      WHITEWATER_ADMIN_API_KEY: ${WHITEWATER_ADMIN_API_KEY:-whitewater-local-development-admin-key}
    expose:
      - "7070"
    ports:
      - "7070"
    volumes:
      - /var/lib/whitewater
    restart: unless-stopped
