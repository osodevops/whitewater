name: whitewater-m4-move-test

x-node: &node
  build:
    context: .
  environment: &node-environment
    WHITEWATER_SEEDS: node1:7070,node2:7070,node3:7070,node4:7070
    WHITEWATER_NODE_CAPACITY: 100
    WHITEWATER_ADMIN_API_KEY: ${WHITEWATER_ADMIN_API_KEY:-whitewater-local-development-admin-key}
    WHITEWATER_CONTROL_NODES: 1@node1:7070,2@node2:7070,3@node3:7070,4@node4:7070
    WHITEWATER_CONTROL_PLANE_KEY: ${WHITEWATER_CONTROL_PLANE_KEY:-whitewater-local-development-control-key}
    WHITEWATER_INTERNAL_TRANSPORT: ${WHITEWATER_INTERNAL_TRANSPORT:-insecure}
    WHITEWATER_AUTO_SPLIT_APPEND_RATE: 1000000000
    WHITEWATER_AUTO_MERGE_SUSTAINED_SAMPLES: 1000000000

services:
  node1:
    <<: *node
    ports:
      - "7171:7070"
    environment:
      <<: *node-environment
      WHITEWATER_NODE_ID: whitewater-m4-node1
      WHITEWATER_CONTROL_NODE_ID: 1
      WHITEWATER_ADVERTISE_URL: http://node1:7070
    volumes:
      - node1-data:/var/lib/whitewater

  node2:
    <<: *node
    ports:
      - "7172:7070"
    environment:
      <<: *node-environment
      WHITEWATER_NODE_ID: whitewater-m4-node2
      WHITEWATER_CONTROL_NODE_ID: 2
      WHITEWATER_ADVERTISE_URL: http://node2:7070
    volumes:
      - node2-data:/var/lib/whitewater

  node3:
    <<: *node
    ports:
      - "7173:7070"
    environment:
      <<: *node-environment
      WHITEWATER_NODE_ID: whitewater-m4-node3
      WHITEWATER_CONTROL_NODE_ID: 3
      WHITEWATER_ADVERTISE_URL: http://node3:7070
    volumes:
      - node3-data:/var/lib/whitewater

  node4:
    <<: *node
    ports:
      - "7174:7070"
    environment:
      <<: *node-environment
      WHITEWATER_NODE_ID: whitewater-m4-node4
      WHITEWATER_CONTROL_NODE_ID: 4
      WHITEWATER_ADVERTISE_URL: http://node4:7070
    volumes:
      - node4-data:/var/lib/whitewater

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
