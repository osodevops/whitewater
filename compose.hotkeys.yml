name: whitewater-hotkeys

x-node: &node
  build:
    context: .
  environment: &node-environment
    FINNSTREAM_SEEDS: control-1:7070,control-2:7070,control-3:7070
    FINNSTREAM_NODE_CAPACITY: 100
    FINNSTREAM_ADMIN_API_KEY: ${FINNSTREAM_ADMIN_API_KEY:-whitewater-local-development-admin-key}
    FINNSTREAM_CONTROL_NODES: 1@control-1:7070,2@control-2:7070,3@control-3:7070
    FINNSTREAM_CONTROL_PLANE_KEY: ${FINNSTREAM_CONTROL_PLANE_KEY:-whitewater-local-development-control-key}
    WHITEWATER_AUTO_SPLIT_INTERVAL_MS: 1000
    WHITEWATER_AUTO_SPLIT_APPEND_RATE: 8
    WHITEWATER_AUTO_SPLIT_SUSTAINED_SAMPLES: 2
    WHITEWATER_AUTO_SPLIT_COOLDOWN_SAMPLES: 15
    WHITEWATER_AUTO_MERGE_SUSTAINED_SAMPLES: 1000000000
    WHITEWATER_HOT_KEY_SUSTAINED_SAMPLES: 2
    WHITEWATER_HOT_KEY_CLEAR_SAMPLES: 30

services:
  control-1:
    <<: *node
    ports:
      - "7971:7070"
    environment:
      <<: *node-environment
      FINNSTREAM_NODE_ID: whitewater-hotkeys-1
      FINNSTREAM_CONTROL_NODE_ID: 1
      FINNSTREAM_ADVERTISE_URL: http://control-1:7070
    volumes:
      - control-1-data:/var/lib/finnstream

  control-2:
    <<: *node
    ports:
      - "7972:7070"
    environment:
      <<: *node-environment
      FINNSTREAM_NODE_ID: whitewater-hotkeys-2
      FINNSTREAM_CONTROL_NODE_ID: 2
      FINNSTREAM_ADVERTISE_URL: http://control-2:7070
    volumes:
      - control-2-data:/var/lib/finnstream

  control-3:
    <<: *node
    ports:
      - "7973:7070"
    environment:
      <<: *node-environment
      FINNSTREAM_NODE_ID: whitewater-hotkeys-3
      FINNSTREAM_CONTROL_NODE_ID: 3
      FINNSTREAM_ADVERTISE_URL: http://control-3:7070
    volumes:
      - control-3-data:/var/lib/finnstream

volumes:
  control-1-data:
  control-2-data:
  control-3-data:
