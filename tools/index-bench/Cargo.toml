[package]
name = "index-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Reference-workload benchmark for Whitewater Index engine candidates (Fjall / redb / RocksDB)."

# Standalone workspace: this tool is intentionally outside the finnstream
# package so `cargo clippy --all-features` and the standard test suite never
# build the RocksDB C++ toolchain.
[workspace]

[dependencies]
finnstream = { path = "../.." }
fjall = "=3.1.10"
redb = "2"
rocksdb = "0.23"
uuid = { version = "1.12.1", features = ["v4"] }
