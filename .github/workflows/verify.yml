name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: python3 -m unittest discover -s tests -p "test_*acceptance.py"

  live-acceptance:
    needs: rust-gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      COMPOSE_FILE: compose.verify.yml
      WHITEWATER_TEST_BASE_PORT: "7371"
      # Hosted runners throttle under load — give owner recovery headroom.
      MANY_READERS_OWNER_RECOVERY_TIMEOUT: "360"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runners arrive with a large pre-cached image set; reclaim it before
      # the suite builds images and stacks container layers on the same disk.
      - name: Reclaim Docker disk space
        run: |
          docker system prune --all --volumes --force || true
          docker system df
      - name: Live acceptance suite
        run: python scripts/run-acceptance.py
      - name: Upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics
          path: acceptance-logs/
          if-no-files-found: warn
      - name: Verify no test residue
        if: always()
        run: |
          echo "containers: $(docker ps -aq | wc -l)"
          echo "volumes: $(docker volume ls -q | wc -l)"
          docker ps -a --format "table {{.Names}}\t{{.Status}}"
          docker volume ls
